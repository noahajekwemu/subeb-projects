<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Resource Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .metric-card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .critical { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5">
        <header class="pb-3 mb-4 border-bottom">
            <span class="fs-4 fw-bold">Institutional Resource & Allocation Dashboard</span>
        </header>

        <!-- Metrics Row -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="card metric-card p-3 text-center">
                    <h6 class="text-muted">Total Educational Resources</h6>
                    <h2 id="total-inventory">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card metric-card p-3 text-center">
                    <h6 class="text-muted">Critical Shortages</h6>
                    <h2 id="critical-shortages" class="text-danger">0</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card metric-card p-3 text-center">
                    <h6 class="text-muted">System Data Accuracy</h6>
                    <h2 id="data-accuracy">0%</h2>
                </div>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="card metric-card">
            <div class="card-body">
                <h5 class="card-title mb-4">Live Inventory Status</h5>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Current Stock</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table">
                            <!-- Data will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                // Fetch the JSON file generated by parse_sheets.py
                const response = await fetch('inventory.json');
                const data = await response.json();

                // Update Metrics
                document.getElementById('total-inventory').innerText = data.metrics.total_inventory.toLocaleString();
                document.getElementById('critical-shortages').innerText = data.metrics.critical_shortages;
                document.getElementById('data-accuracy').innerText = data.metrics.data_accuracy;

                // Update Table
                const tableBody = document.getElementById('inventory-table');
                data.items.forEach(item => {
                    const row = `
                        <tr>
                            <td>${item['Item Name']}</td>
                            <td>${item['Category']}</td>
                            <td>${item['Current Stock']}</td>
                            <td class="${item['Allocation Status'] === 'Critical Shortage' ? 'critical' : ''}">
                                ${item['Allocation Status']}
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading dashboard data:", error);
            }
        }
        loadDashboardData();
    </script>
</body>
</html>
