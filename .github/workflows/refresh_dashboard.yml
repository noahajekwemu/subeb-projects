name: Refresh Dashboard Data

on:
  schedule:
    - cron: '0 * * * *' 
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # This environment variable addresses the warning in your error log
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy fsspec

      - name: Run Data Aggregator
        # Check this specific step in your GitHub Actions log if it still fails
        run: python parse_sheets.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/inventory.json
          git commit -m "Automated update: Latest educational operational metrics" || echo "No changes to commit"
          git push
