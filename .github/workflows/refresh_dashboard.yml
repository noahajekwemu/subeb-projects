name: Automated Board Dashboard Pipeline

on:
  schedule:
    - cron: '23 * * * *' # Shifting out of peak hours to avoid queuing traffic delays
  workflow_dispatch: 

# Force environment engine parameters to clear deprecation blocks
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-parse:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Source
      uses: actions/checkout@v4.1.7 # Explicit pin to version supporting Node24 patches

    - name: Initialize Environment Runtime
      uses: actions/setup-python@v5.1.1 # Explicit pin to version supporting Node24 patches
      with:
        python-version: '3.11'

    - name: Inject Parsing Dependencies
      run: pip install pandas openpyxl numpy

    - name: Execute Extraction Matrix
      run: python parse_sheets.py

    - name: Standardize and Save Generated Artifacts
      run: |
        git config --global user.name 'Board Automation Engine'
        git config --global user.email 'automation@schoolboard.gov'
        git add web/inventory.json
        git commit -m "System-automated synchronization update" || exit 0
        git push
