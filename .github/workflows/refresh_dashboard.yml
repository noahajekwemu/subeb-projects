name: Refresh Dashboard Data

on:
  schedule:
    # Triggers on an hourly cron timeline as required in Phase 3
    - cron: '0 * * * *' 
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code (Updated from v3 to v4)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up the Python environment (Updated from v4 to v5)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install necessary libraries
      - name: Install Dependencies
        run: |
          pip install pandas numpy fsspec

      # 4. Execute the Data Aggregator script
      - name: Run Data Aggregator
        run: python parse_sheets.py

      # 5. Commit the generated inventory.json back to the web/ folder
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/inventory.json
          git commit -m "Automated update: Latest educational operational metrics" || echo "No changes to commit"
          git push
